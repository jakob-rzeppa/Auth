[package]
name = "e2e-tests"
version = "0.1.0"
edition = "2024"
publish = false

# Black-box HTTP tests against a running identity-server. Deliberately a separate
# crate, not a workspace member: it shares no code with the service, and its
# client dependencies stay out of the service's dependency graph.

[dependencies]

[dev-dependencies]
# Blocking client, no TLS backend and no async runtime: the suite only ever makes
# sequential plain-HTTP calls to the service inside the compose network. Avoiding
# reqwest/hyper/tokio keeps the dependency graph (and compile time) small.
ureq = { version = "3", default-features = false, features = ["json"] }
serde_json = "1.0.151"
uuid = { version = "1.26.0", features = ["v4"] }

# This crate is only ever built for tests; debuginfo just costs compile and link
# time here.
[profile.test]
debug = false
