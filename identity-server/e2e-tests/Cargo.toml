[package]
name = "e2e-tests"
version = "0.1.0"
edition = "2024"
publish = false

# Black-box HTTP tests against a running identity-server. Deliberately a separate
# crate, not a workspace member: it shares no code with the service, and its
# client dependencies stay out of the service's dependency graph.

[dependencies]

[dev-dependencies]
# No TLS backend: the suite only ever talks to the service over plain HTTP inside
# the compose network, and dropping it avoids needing OpenSSL in the test image.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.26.0", features = ["v4"] }
