services:
  identity-server-db:
    image: postgres:17-alpine
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false
    networks:
      - identity-server-internal
    volumes:
      - identity-server-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: applies migrations and exits. The server only starts once this
  # has completed successfully. Re-run on its own with:
  #   docker compose run --rm identity-server-migrate
  identity-server-migrate:
    build:
      context: .
      target: migrator
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false
    restart: "no"
    networks:
      - identity-server-internal
    depends_on:
      identity-server-db:
        condition: service_healthy

  identity-server:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false
    networks:
      - identity-server-internal
      - identity-server
    ports:
      - "${APP_HOST_PORT:-8080}:${APP_PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$$APP_PORT/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      identity-server-migrate:
        condition: service_completed_successfully

networks:
  # No route off this network: the database is reachable only from containers
  # attached to it, and has no outbound access itself.
  identity-server-internal:
    internal: true

  # Carries the server's published port.
  identity-server:

volumes:
  identity-server-db-data:
