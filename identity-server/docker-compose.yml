# Topology only. Nothing here publishes a host port, so the stack can be brought
# up more than once side by side under different project names.
# Host ports live in docker-compose.dev.yml; the e2e stack adds docker-compose.e2e.yml.
services:
  identity-server-db:
    image: postgres:17-alpine
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false
    networks:
      - identity-server-internal
    volumes:
      - identity-server-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  identity-server-migrate:
    build:
      context: .
      target: migrator
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false
    command: ["migrate", "run"]
    networks:
      - identity-server-internal
    volumes:
      - ./migrations:/app/migrations
    depends_on:
      identity-server-db:
        condition: service_healthy

  identity-server:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false
    networks:
      - identity-server-internal
      - identity-server
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${APP_PORT}/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      identity-server-migrate:
        condition: service_completed_successfully

networks:
  # internal: no route off this network. The database is reachable only from
  # containers attached to it, and has no outbound internet access itself.
  identity-server-internal:
    internal: true

  identity-server:

volumes:
  identity-server-db-data:
