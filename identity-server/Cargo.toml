[package]
name = "identity-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version="0.8.9", features=["macros"] }
fnmock = "0.1.0"
serde = "1.0.229"
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "macros", "uuid", "sqlx-toml"] }
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version="1.26.0", features=["v4", "serde"] }

api-macros = { git = "https://github.com/jakob-rzeppa/Auth.git", branch = "main" }
privilege = { git = "https://github.com/jakob-rzeppa/Auth.git", branch = "main" }
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
argon2 = { version = "0.6.0", features = ["getrandom"]}
rand = "0.10.2"
