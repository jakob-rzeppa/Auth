# Topology only. Nothing here publishes a host port, so the stack can be brought
# up more than once side by side under different project names.
# Host ports live in docker-compose.dev.yml.
services:
  auth-server-redis:
    image: redis:8-alpine
    networks:
      - auth-server-internal
    volumes:
      - auth-server-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-server-db:
    image: postgres:17-alpine
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false
    networks:
      - auth-server-internal
    volumes:
      - auth-server-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-server-migrate:
    build:
      context: .
      target: migrator
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false
    command: ["migrate", "run"]
    networks:
      - auth-server-internal
    volumes:
      - ./migrations:/app/migrations
    depends_on:
      auth-server-db:
        condition: service_healthy

  auth-server:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false
    networks:
      - auth-server-internal
      - auth-server
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${APP_PORT}/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      auth-server-redis:
        condition: service_healthy
      auth-server-migrate:
        condition: service_completed_successfully

networks:
  # internal: no route off this network. Redis and the database are reachable only
  # from containers attached to it, and have no outbound internet access itself.
  auth-server-internal:
    internal: true

  auth-server:

volumes:
  auth-server-redis-data:
  auth-server-db-data:
